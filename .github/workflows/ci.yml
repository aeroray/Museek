name: CI

# Runs on every push and pull request. Release builds are separate (release.yml,
# triggered by a version tag) — this one exists so a regression is caught on the
# commit that introduced it, not weeks later when a release is cut.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No `version:` here — it must come from package.json's `packageManager`
      # (pnpm@9.15.9). Specifying both makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified".
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # The regression checks. Two of them drive a headless browser; the runner
      # reports those as SKIP when no browser is available rather than failing,
      # so this stays useful on a bare runner. Ubuntu images ship Chrome, so in
      # practice they run here too.
      - name: Regression checks
        run: pnpm test

      - name: Build frontend
        run: pnpm exec vite build
