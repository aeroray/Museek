[package]
name = "museek"
version = "1.1.1"
description = "Museek 拾音 — Desktop Music Aggregator"
authors = ["you"]
edition = "2021"

[lib]
name = "museek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
souvlaki = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
base64 = "0.22"
tauri-plugin-process = "2"
tokio = { version = "1", default-features = false, features = ["time"] }

# Windows taskbar thumbnail toolbar (hover-over-taskbar media buttons). Reuses the
# same `windows` crate version Tauri already pulls in, just with extra features.
[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
windows = { version = "0.61", features = [
    "Media",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_WinRT_Media",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8", features = ["macos_13_0"] }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "block2",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "NSFontManager",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2.3.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
url = "2"

